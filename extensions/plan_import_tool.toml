[summary]
es = "Importa planos y juegos de planos completos desde PDF vectorial a escala: plantas apiladas por nivel, alzados y cortes de pie, recorte automático del cajetín, punto de referencia, niveles y capas. Vista previa en vivo."
en = "Imports floor plans and whole plan sets from vector PDFs at scale: floor plans stacked on their levels, elevations and sections upright, automatic crop of the title block, reference point, levels and layers. Live preview."
pt = "Importa plantas e conjuntos de pranchas de PDF vetorial em escala: plantas empilhadas por nível, fachadas e cortes em pé, recorte automático do carimbo, ponto de referência, níveis e camadas. Pré-visualização ao vivo."
